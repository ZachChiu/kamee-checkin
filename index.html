<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KAMEE 90天健康計畫</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5FBFBF">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAMEE">
<style>
  :root{
    --teal:#5FBFBF;
    --teal-deep:#3EA6A6;
    --teal-soft:#DDF1F1;
    --cream:#FBF9F4;
    --sand:#F0EBE0;
    --ink:#2E4A4A;
    --ink-soft:#8AA3A3;
    --gold:#F2C14E;
    --gold-soft:#FBECC7;
    --line:#EAE6DC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.6;
    display:flex;justify-content:center;min-height:100vh;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .phone{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}

  .topbar{display:flex;align-items:center;justify-content:center;padding:4px 0}
  .logo{font-size:20px;font-weight:800;letter-spacing:.5px;color:var(--teal-deep)}
  .logo span{color:var(--gold)}

  .welcome{padding:0 4px}
  .welcome h1{font-size:22px;font-weight:800;color:var(--ink);cursor:pointer}
  .welcome p{font-size:13.5px;color:var(--ink-soft)}

  /* tabs */
  .tabs{display:flex;background:#fff;border-radius:14px;padding:5px;box-shadow:0 4px 14px rgba(62,166,166,.08)}
  .tab{flex:1;text-align:center;padding:9px;font-size:13.5px;font-weight:700;border-radius:10px;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-family:inherit}
  .tab.on{background:var(--teal-soft);color:var(--teal-deep)}

  /* streak row */
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:#fff;border-radius:18px;padding:20px 14px;text-align:center;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .stat .ico{font-size:22px;margin-bottom:2px}
  .stat .num{font-size:44px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .stat .lbl{font-size:13.5px;font-weight:700;margin-top:6px}
  .stat .sub{font-size:11.5px;color:var(--ink-soft)}
  .stat.streak .ico{color:var(--gold)}
  .stat.best .ico{color:var(--teal)}

  /* milestone */
  .milestone{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .ms-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .ms-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
  .ms-count{font-size:12px;color:var(--ink-soft);font-weight:700}
  .ms-bar{height:8px;background:var(--sand);border-radius:99px;overflow:hidden}
  .ms-bar>i{display:block;height:100%;width:0;background:var(--teal);border-radius:99px;transition:width .7s}
  .ms-note{font-size:11.5px;color:var(--ink-soft);margin-top:8px;text-align:center}

  /* check-in button */
  .btn{width:100%;border:none;cursor:pointer;background:var(--teal);color:#fff;
    font-size:16.5px;font-weight:800;font-family:inherit;padding:16px;border-radius:14px;
    box-shadow:0 6px 16px rgba(95,191,191,.38);transition:transform .15s,background .2s;letter-spacing:.5px}
  .btn:active{transform:scale(.98)}
  .btn.done{background:var(--gold-soft);color:var(--teal-deep);box-shadow:none}

  /* calendar */
  .cal{background:#fff;border-radius:18px;padding:16px 16px 20px;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
  .cal-head .m{font-size:15px;font-weight:800;min-width:120px;text-align:center}
  .cal-head button{background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:2px 10px;font-family:inherit}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .cal-grid .wd{font-size:11px;color:var(--ink-soft);font-weight:700;padding-bottom:4px}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;
    border-radius:50%;color:var(--ink);font-variant-numeric:tabular-nums;border:none;background:none;
    font-family:inherit;cursor:pointer;padding:0}
  .cell.empty{visibility:hidden}
  .cell.done{background:var(--teal-deep);color:#fff;font-weight:700}
  .cell.today{background:var(--gold);color:#fff;font-weight:800;box-shadow:0 0 0 3px var(--gold-soft)}
  .cell.today.done{background:var(--teal-deep);box-shadow:0 0 0 3px var(--gold)}
  .cell.future{color:#C9CFCF;cursor:default}

  .legend{display:flex;justify-content:center;gap:16px;margin-top:14px;font-size:11px;color:var(--ink-soft)}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.done{background:var(--teal-deep)}
  .dot.today{background:var(--gold)}

  /* rewards */
  .rw{background:#fff;border-radius:18px;padding:8px 18px;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .rw-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .rw-item:last-child{border-bottom:none}
  .rw-ico{width:40px;height:40px;border-radius:12px;background:var(--sand);display:flex;
    align-items:center;justify-content:center;font-size:19px;flex:none;filter:grayscale(1);opacity:.55}
  .rw-item.got .rw-ico{background:var(--gold-soft);filter:none;opacity:1}
  .rw-name{font-size:14px;font-weight:800}
  .rw-sub{font-size:11.5px;color:var(--ink-soft)}
  .rw-tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
  .rw-item.got .rw-tag{color:var(--teal-deep)}

  .hide{display:none}
  .foot{text-align:center;font-size:11px;color:var(--ink-soft);padding:4px 0 10px;opacity:.8}
  .enc{text-align:center;font-size:13px;color:var(--teal-deep);font-weight:700;min-height:18px;opacity:0;transition:opacity .4s}
  .enc.show{opacity:1}
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar"><div class="logo">KA<span>ME</span>E</div></div>

    <div class="welcome">
      <h1 id="hello" title="點一下改名字">歡迎回來！</h1>
      <p>很開心又見到你 🌿</p>
    </div>

    <div class="tabs">
      <button class="tab on" data-view="log">每日紀錄</button>
      <button class="tab" data-view="rewards">我的獎勵</button>
    </div>

    <div id="view-log">
      <div class="row2" style="margin-bottom:14px">
        <div class="stat streak">
          <div class="ico">🔥</div>
          <div class="num" id="cur">0</div>
          <div class="lbl">連續天數</div>
          <div class="sub">做得好，繼續保持！</div>
        </div>
        <div class="stat best">
          <div class="ico">🏅</div>
          <div class="num" id="best">0</div>
          <div class="lbl">最佳紀錄</div>
          <div class="sub">你很棒！</div>
        </div>
      </div>

      <div class="milestone" style="margin-bottom:14px">
        <div class="ms-top">
          <div class="ms-title">📈 下一個里程碑</div>
          <div class="ms-count" id="msCount">0 / 7 天</div>
        </div>
        <div class="ms-bar"><i id="msBar"></i></div>
        <div class="ms-note" id="msNote"></div>
      </div>

      <button class="btn" id="btn">我今天吃了 ✓</button>
      <div class="enc" id="enc"></div>

      <div class="cal" style="margin-top:14px">
        <div class="cal-head">
          <button id="prev" aria-label="上個月">‹</button>
          <div class="m" id="calTitle"></div>
          <button id="next" aria-label="下個月">›</button>
        </div>
        <div class="cal-grid" id="grid"></div>
        <div class="legend">
          <span><i class="dot done"></i>已打卡</span>
          <span><i class="dot today"></i>今天</span>
        </div>
      </div>
    </div>

    <div id="view-rewards" class="hide">
      <div class="rw" id="rwList"></div>
    </div>

    <div class="foot">KAMEE 客製化保健品智能服務</div>
  </div>

<script src="streak.js"></script>
<script>
const KEY='kamee.checkins.v1', NAMEKEY='kamee.name.v1';
const MILESTONES=[{d:7,ico:'🎁',name:'7 天禮'},{d:14,ico:'🍵',name:'14 天禮'},
  {d:30,ico:'💎',name:'30 天禮'},{d:60,ico:'🌿',name:'60 天禮'},{d:90,ico:'👑',name:'90 天完賽'}];

const load=()=>{try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch{return new Set()}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done].sort()))}catch{}};

let done=load();
let view=new Date(); view.setDate(1);
const todayStr=ymd(new Date());

function renderStats(){
  const {cur,best}=streaks(done);
  cur_.textContent=cur; best_.textContent=best;
  const goal=(MILESTONES.find(m=>m.d>cur)||MILESTONES[MILESTONES.length-1]).d;
  msBar.style.width=Math.min(cur/goal*100,100)+'%';
  msCount.textContent=`${cur} / ${goal} 天`;
  const left=goal-cur;
  msNote.textContent= left>0?`再 ${left} 天達成 ${goal} 天里程碑！🎁`:`已達成 ${goal} 天里程碑！🎉`;

  const isDone=done.has(todayStr);
  btn.classList.toggle('done',isDone);
  btn.textContent=isDone?'今天已完成 ✓':'我今天吃了 ✓';
  enc.textContent=isDone?`太棒了！這是你第 ${cur} 天的堅持 💪`:'';
  enc.classList.toggle('show',isDone);

  rwList.innerHTML=MILESTONES.map(m=>{
    const got=best>=m.d;
    return `<div class="rw-item ${got?'got':''}">
      <div class="rw-ico">${m.ico}</div>
      <div><div class="rw-name">${m.name}</div>
        <div class="rw-sub">連續 ${m.d} 天解鎖</div></div>
      <div class="rw-tag">${got?'已解鎖':`還差 ${m.d-best} 天`}</div>
    </div>`;
  }).join('');
}

function renderCal(){
  const y=view.getFullYear(), m=view.getMonth();
  calTitle.textContent=`${y} 年 ${m+1} 月`;
  grid.innerHTML='';
  ['一','二','三','四','五','六','日'].forEach(w=>{
    const e=document.createElement('div');e.className='wd';e.textContent=w;grid.appendChild(e);
  });
  const lead=(new Date(y,m,1).getDay()+6)%7;           // 週一為一週開始
  const total=new Date(y,m+1,0).getDate();
  for(let i=0;i<lead;i++){const e=document.createElement('div');e.className='cell empty';grid.appendChild(e)}
  for(let d=1;d<=total;d++){
    const s=ymd(new Date(y,m,d));
    const b=document.createElement('button');
    b.className='cell'; b.textContent=d;
    if(done.has(s))b.classList.add('done');
    if(s===todayStr)b.classList.add('today');
    if(s>todayStr){b.classList.add('future');b.disabled=true}
    else b.onclick=()=>toggle(s);
    grid.appendChild(b);
  }
}

function toggle(s){
  if(s>todayStr)return;
  if(done.has(s))done.delete(s); else done.add(s);
  save();
  renderStats();renderCal();
}

btn.onclick=()=>toggle(todayStr);
prev.onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
next.onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.getElementById('view-log').classList.toggle('hide',t.dataset.view!=='log');
  document.getElementById('view-rewards').classList.toggle('hide',t.dataset.view!=='rewards');
});

function renderName(){
  const n=localStorage.getItem(NAMEKEY);
  hello.textContent=n?`歡迎回來，${n}！`:'歡迎回來！';
}
hello.onclick=()=>{
  const n=prompt('你的名字',localStorage.getItem(NAMEKEY)||'');
  if(n!==null){ n.trim()?localStorage.setItem(NAMEKEY,n.trim()):localStorage.removeItem(NAMEKEY); renderName() }
};

const cur_=document.getElementById('cur'), best_=document.getElementById('best');
renderName();renderStats();renderCal();

if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
