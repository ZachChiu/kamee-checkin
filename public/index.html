<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KAMEE 90天健康計畫</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5FBFBF">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAMEE">
<style>
  :root{
    --teal:#5FBFBF;
    --teal-deep:#3EA6A6;
    --teal-soft:#DDF1F1;
    --cream:#FBF9F4;
    --sand:#F0EBE0;
    --ink:#2E4A4A;
    --ink-soft:#8AA3A3;
    --gold:#F2C14E;
    --gold-soft:#FBECC7;
    --line:#EAE6DC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.6;
    display:flex;justify-content:center;min-height:100vh;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .phone{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}

  .topbar{display:flex;align-items:center;justify-content:center;padding:4px 0}
  .logo{font-size:20px;font-weight:800;letter-spacing:.5px;color:var(--teal-deep)}
  .logo span{color:var(--gold)}

  .welcome{padding:0 4px}
  .welcome h1{font-size:22px;font-weight:800;color:var(--ink);cursor:pointer}
  .welcome p{font-size:13.5px;color:var(--ink-soft)}

  /* tabs */
  .tabs{display:flex;background:#fff;border-radius:14px;padding:5px;box-shadow:0 4px 14px rgba(62,166,166,.08)}
  .tab{flex:1;text-align:center;padding:9px;font-size:13.5px;font-weight:700;border-radius:10px;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-family:inherit}
  .tab.on{background:var(--teal-soft);color:var(--teal-deep)}

  /* streak row */
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:#fff;border-radius:18px;padding:20px 14px;text-align:center;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .stat .ico{font-size:22px;margin-bottom:2px}
  .stat .num{font-size:44px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .stat .lbl{font-size:13.5px;font-weight:700;margin-top:6px}
  .stat .sub{font-size:11.5px;color:var(--ink-soft)}
  .stat.streak .ico{color:var(--gold)}
  .stat.best .ico{color:var(--teal)}

  /* milestone */
  .milestone{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .ms-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .ms-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
  .ms-count{font-size:12px;color:var(--ink-soft);font-weight:700}
  .ms-bar{height:8px;background:var(--sand);border-radius:99px;overflow:hidden}
  .ms-bar>i{display:block;height:100%;width:0;background:var(--teal);border-radius:99px;transition:width .7s}
  .ms-note{font-size:11.5px;color:var(--ink-soft);margin-top:8px;text-align:center}

  /* check-in button */
  .btn{width:100%;border:none;cursor:pointer;background:var(--teal);color:#fff;
    font-size:16.5px;font-weight:800;font-family:inherit;padding:16px;border-radius:14px;
    box-shadow:0 6px 16px rgba(95,191,191,.38);transition:transform .15s,background .2s;letter-spacing:.5px}
  .btn:active{transform:scale(.98)}
  .btn.done{background:var(--gold-soft);color:var(--teal-deep);box-shadow:none}

  /* calendar */
  .cal{background:#fff;border-radius:18px;padding:16px 16px 20px;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
  .cal-head .m{font-size:15px;font-weight:800;min-width:120px;text-align:center}
  .cal-head button{background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:2px 10px;font-family:inherit}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .cal-grid .wd{font-size:11px;color:var(--ink-soft);font-weight:700;padding-bottom:4px}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;
    border-radius:50%;color:var(--ink);font-variant-numeric:tabular-nums;border:none;background:none;
    font-family:inherit;cursor:pointer;padding:0}
  .cell.empty{visibility:hidden}
  .cell.done{background:var(--teal-deep);color:#fff;font-weight:700}
  .cell.today{background:var(--gold);color:#fff;font-weight:800;box-shadow:0 0 0 3px var(--gold-soft)}
  .cell.today.done{background:var(--teal-deep);box-shadow:0 0 0 3px var(--gold)}
  .cell.future{color:#C9CFCF;cursor:default}

  .legend{display:flex;justify-content:center;gap:16px;margin-top:14px;font-size:11px;color:var(--ink-soft)}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.done{background:var(--teal-deep)}
  .dot.today{background:var(--gold)}

  /* rewards */
  .rw{background:#fff;border-radius:18px;padding:8px 18px;box-shadow:0 6px 18px rgba(62,166,166,.08)}
  .rw-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .rw-item:last-child{border-bottom:none}
  .rw-ico{width:40px;height:40px;border-radius:12px;background:var(--sand);display:flex;
    align-items:center;justify-content:center;font-size:19px;flex:none;filter:grayscale(1);opacity:.55}
  .rw-item.got .rw-ico{background:var(--gold-soft);filter:none;opacity:1}
  .rw-name{font-size:14px;font-weight:800}
  .rw-sub{font-size:11.5px;color:var(--ink-soft)}
  .rw-tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
  .rw-item.got .rw-tag{color:var(--teal-deep)}

  /* reminder */
  .remind{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;
    padding:12px 16px;box-shadow:0 6px 18px rgba(62,166,166,.08);margin-top:14px}
  .remind .t{font-size:13px;font-weight:800}
  .remind .s{font-size:11px;color:var(--ink-soft)}
  .sw{margin-left:auto;width:46px;height:27px;border-radius:99px;background:var(--sand);border:none;
    position:relative;cursor:pointer;transition:background .2s;flex:none}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw.on{background:var(--teal)}
  .sw.on::after{transform:translateX(19px)}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(46,74,74,.45);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:9}
  .modal{background:#fff;border-radius:22px;padding:26px 22px 18px;width:100%;max-width:320px;
    text-align:center;box-shadow:0 18px 40px rgba(46,74,74,.25)}
  .m-ico{font-size:40px;line-height:1}
  .modal h2{font-size:18px;font-weight:800;margin:8px 0 6px}
  .modal p{font-size:13px;color:var(--ink-soft);margin-bottom:16px;white-space:pre-line}
  .m-code{display:inline-block;font-size:15px;font-weight:800;letter-spacing:2px;color:var(--teal-deep);
    background:var(--teal-soft);border-radius:10px;padding:8px 16px;margin-bottom:16px}
  .m-no{background:none;border:none;font-family:inherit;font-size:12.5px;color:var(--ink-soft);
    margin-top:12px;cursor:pointer;text-decoration:underline}

  .rw-code{font-size:11.5px;font-weight:800;color:var(--teal-deep);letter-spacing:1px}
  .hide{display:none}
  .foot{text-align:center;font-size:11px;color:var(--ink-soft);padding:4px 0 10px;opacity:.8}
  .enc{text-align:center;font-size:13px;color:var(--teal-deep);font-weight:700;min-height:18px;opacity:0;transition:opacity .4s}
  .enc.show{opacity:1}
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar"><div class="logo">KA<span>ME</span>E</div></div>

    <div class="welcome">
      <h1 id="hello" title="點一下改名字">歡迎回來！</h1>
      <p>很開心又見到你 🌿</p>
    </div>

    <div class="tabs">
      <button class="tab on" data-view="log">每日紀錄</button>
      <button class="tab" data-view="rewards">我的獎勵</button>
    </div>

    <div id="view-log">
      <div class="row2" style="margin-bottom:14px">
        <div class="stat streak">
          <div class="ico">🔥</div>
          <div class="num" id="cur">0</div>
          <div class="lbl">連續天數</div>
          <div class="sub">做得好，繼續保持！</div>
        </div>
        <div class="stat best">
          <div class="ico">🏅</div>
          <div class="num" id="best">0</div>
          <div class="lbl">最佳紀錄</div>
          <div class="sub">你很棒！</div>
        </div>
      </div>

      <div class="milestone" style="margin-bottom:14px">
        <div class="ms-top">
          <div class="ms-title">📈 下一個里程碑</div>
          <div class="ms-count" id="msCount">0 / 7 天</div>
        </div>
        <div class="ms-bar"><i id="msBar"></i></div>
        <div class="ms-note" id="msNote"></div>
      </div>

      <button class="btn" id="btn">我今天吃了 ✓</button>
      <div class="enc" id="enc"></div>

      <div class="remind">
        <div>
          <div class="t">🔔 每天 09:00 提醒</div>
          <div class="s" id="remindSub">還沒開啟</div>
        </div>
        <button class="sw" id="remindSw" aria-label="開啟每日提醒"></button>
      </div>

      <div class="cal" style="margin-top:14px">
        <div class="cal-head">
          <button id="prev" aria-label="上個月">‹</button>
          <div class="m" id="calTitle"></div>
          <button id="next" aria-label="下個月">›</button>
        </div>
        <div class="cal-grid" id="grid"></div>
        <div class="legend">
          <span><i class="dot done"></i>已打卡</span>
          <span><i class="dot today"></i>今天</span>
        </div>
      </div>
    </div>

    <div id="view-rewards" class="hide">
      <div class="rw" id="rwList"></div>
    </div>

    <div class="foot">KAMEE 客製化保健品智能服務</div>
  </div>

  <div class="mask hide" id="mask">
    <div class="modal">
      <div class="m-ico" id="mIco"></div>
      <h2 id="mTitle"></h2>
      <p id="mBody"></p>
      <div class="m-code hide" id="mCode"></div>
      <button class="btn" id="mOk"></button>
      <button class="m-no hide" id="mNo"></button>
    </div>
  </div>

<script src="streak.js"></script>
<script>
const KEY='kamee.checkins.v1', NAMEKEY='kamee.name.v1',
      REMIND_KEY='kamee.remind.v1', INSTALL_KEY='kamee.install.v1', ASKED_KEY='kamee.notifyAsked.v1',
      UID_KEY='kamee.uid.v1', PUSH_KEY='kamee.push.v1';
const REMIND_HOUR=9;
const MILESTONES=[
  {d:7, ico:'🎁',name:'7 天禮',   code:'KAMEE7',  gift:'下次回購 9 折'},
  {d:14,ico:'🍵',name:'14 天禮',  code:'KAMEE14', gift:'加贈體驗包 1 包'},
  {d:30,ico:'💎',name:'30 天禮',  code:'KAMEE30', gift:'免運券 1 張'},
  {d:60,ico:'🌿',name:'60 天禮',  code:'KAMEE60', gift:'客製配方免費調整'},
  {d:90,ico:'👑',name:'90 天完賽',code:'KAMEE90', gift:'完賽禮盒'}];

const load=()=>{try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch{return new Set()}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done].sort()))}catch{}};

let done=load();
let view=new Date(); view.setDate(1);
const todayStr=ymd(new Date());

function renderStats(){
  const {cur,best}=streaks(done);
  cur_.textContent=cur; best_.textContent=best;
  const goal=(MILESTONES.find(m=>m.d>cur)||MILESTONES[MILESTONES.length-1]).d;
  msBar.style.width=Math.min(cur/goal*100,100)+'%';
  msCount.textContent=`${cur} / ${goal} 天`;
  const left=goal-cur;
  msNote.textContent= left>0?`再 ${left} 天達成 ${goal} 天里程碑！🎁`:`已達成 ${goal} 天里程碑！🎉`;

  const isDone=done.has(todayStr);
  btn.classList.toggle('done',isDone);
  btn.textContent=isDone?'今天已完成 ✓':'我今天吃了 ✓';
  enc.textContent=isDone?`太棒了！這是你第 ${cur} 天的堅持 💪`:'';
  enc.classList.toggle('show',isDone);

  rwList.innerHTML=MILESTONES.map(m=>{
    const got=best>=m.d;
    return `<div class="rw-item ${got?'got':''}">
      <div class="rw-ico">${m.ico}</div>
      <div><div class="rw-name">${m.name} · ${m.gift}</div>
        ${got?`<div class="rw-code">${m.code}</div>`:`<div class="rw-sub">連續 ${m.d} 天解鎖</div>`}</div>
      <div class="rw-tag">${got?'已解鎖':`還差 ${m.d-best} 天`}</div>
    </div>`;
  }).join('');
}

function renderCal(){
  const y=view.getFullYear(), m=view.getMonth();
  calTitle.textContent=`${y} 年 ${m+1} 月`;
  grid.innerHTML='';
  ['一','二','三','四','五','六','日'].forEach(w=>{
    const e=document.createElement('div');e.className='wd';e.textContent=w;grid.appendChild(e);
  });
  const lead=(new Date(y,m,1).getDay()+6)%7;           // 週一為一週開始
  const total=new Date(y,m+1,0).getDate();
  for(let i=0;i<lead;i++){const e=document.createElement('div');e.className='cell empty';grid.appendChild(e)}
  for(let d=1;d<=total;d++){
    const s=ymd(new Date(y,m,d));
    const b=document.createElement('button');
    b.className='cell'; b.textContent=d;
    if(done.has(s))b.classList.add('done');
    if(s===todayStr)b.classList.add('today');
    if(s>todayStr)b.classList.add('future');
    b.disabled=true;                                   // 只能用按鈕打當天的卡
    grid.appendChild(b);
  }
}

function checkIn(){
  const today=ymd(new Date());
  if(today!==todayStr){ location.reload(); return }      // 跨過午夜，重載換成新的一天
  if(!canCheckIn(done,today,todayStr)) return;
  done.add(today); save(); syncSw();
  if(pushOn()) api('/api/checkin',{method:'POST',body:JSON.stringify({uid,date:today})});
  renderStats();renderCal();
  const m=earnedMilestone(streaks(done).cur,MILESTONES);
  if(m) reward(m);
  else if(localStorage.getItem(ASKED_KEY)!=='1') askNotify();
}

btn.onclick=checkIn;
prev.onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
next.onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.getElementById('view-log').classList.toggle('hide',t.dataset.view!=='log');
  document.getElementById('view-rewards').classList.toggle('hide',t.dataset.view!=='rewards');
});

function renderName(){
  const n=localStorage.getItem(NAMEKEY);
  hello.textContent=n?`歡迎回來，${n}！`:'歡迎回來！';
}
hello.onclick=()=>{
  const n=prompt('你的名字',localStorage.getItem(NAMEKEY)||'');
  if(n!==null){ n.trim()?localStorage.setItem(NAMEKEY,n.trim()):localStorage.removeItem(NAMEKEY); renderName() }
};

const cur_=document.getElementById('cur'), best_=document.getElementById('best');

/* ---------- 後端（Cloudflare Worker，沒有就自動降級成只有前景提醒） ---------- */
const uid=(()=>{
  let v=localStorage.getItem(UID_KEY);
  if(!v){ v=(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,'');
    localStorage.setItem(UID_KEY,v) }
  return v;
})();
const api=(path,init={})=>fetch(path,{headers:{'content-type':'application/json'},...init})
  .then(r=>r.ok?r.json():null).catch(()=>null);
const pushOn=()=>localStorage.getItem(PUSH_KEY)==='on';
const b64ToBytes=s=>{const t=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(t),c=>c.charCodeAt(0))};

// 訂閱失敗不擋使用者，前景計時器照常運作
async function subscribePush(){
  try{
    const cfg=await api('/api/config');
    if(!cfg?.vapidPublicKey) return false;
    const reg=await navigator.serviceWorker.ready;
    const key=b64ToBytes(cfg.vapidPublicKey);
    let sub=await reg.pushManager.getSubscription();
    if(sub && !sub.options?.applicationServerKey) { await sub.unsubscribe(); sub=null }   // 換過金鑰
    sub=sub||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    const r=await api('/api/subscribe',{method:'POST',body:JSON.stringify({
      uid, subscription:sub.toJSON(), tz:Intl.DateTimeFormat().resolvedOptions().timeZone })});
    localStorage.setItem(PUSH_KEY, r?.ok?'on':'off');
    return !!r?.ok;
  }catch{ localStorage.setItem(PUSH_KEY,'off'); return false }
}
async function unsubscribePush(){
  localStorage.setItem(PUSH_KEY,'off');
  try{
    const reg=await navigator.serviceWorker.ready;
    (await reg.pushManager.getSubscription())?.unsubscribe();
    await api('/api/subscribe?uid='+uid,{method:'DELETE'});
  }catch{}
}

/* ---------- modal（獎勵 / 安裝 / 通知共用一個） ---------- */
let modalOpen=false;
function openModal({ico,title,body,code,ok,onOk,no,onNo}){
  modalOpen=true;
  mIco.textContent=ico; mTitle.textContent=title; mBody.textContent=body;
  mCode.textContent=code||''; mCode.classList.toggle('hide',!code);
  mOk.textContent=ok;
  mOk.onclick=()=>{closeModal(); onOk&&onOk()};
  mNo.textContent=no||''; mNo.classList.toggle('hide',!no);
  mNo.onclick=()=>{closeModal(); onNo&&onNo()};
  mask.classList.remove('hide');
}
function closeModal(){mask.classList.add('hide');modalOpen=false}

function reward(m){
  openModal({ico:m.ico,title:`連續 ${m.d} 天，達成！`,
    body:`獎勵：${m.gift}\n下單時輸入這組代碼`,code:m.code,ok:'收下獎勵 ✓',
    onOk:()=>{ if(localStorage.getItem(ASKED_KEY)!=='1') askNotify() }});
}

/* ---------- 每天 09:00 提醒 ---------- */
// ponytail: 沒有後端 push，靠前景計時器 + periodic sync；要準時到秒需要 Web Push 伺服器
const canNotify='Notification' in window;
const remindOn=()=>localStorage.getItem(REMIND_KEY)==='on'&&canNotify&&Notification.permission==='granted';

function renderRemind(){
  remindSw.classList.toggle('on',remindOn());
  remindSub.textContent = !canNotify ? '這個瀏覽器不支援通知'
    : Notification.permission==='denied' ? '已被封鎖，請到瀏覽器設定開啟'
    : remindOn() ? (pushOn()?'開啟中，每天 09:00 提醒你':'開啟中，但只在這個頁面開著時提醒')
    : '還沒開啟';
}

async function enableRemind(){
  if(!canNotify) return;
  if(Notification.permission==='default') await Notification.requestPermission();
  if(Notification.permission!=='granted'){renderRemind();return}
  localStorage.setItem(REMIND_KEY,'on');
  renderRemind();
  await subscribePush();                       // 有後端就由伺服器在 09:00 推播
  const reg=await navigator.serviceWorker?.ready.catch(()=>null);
  if(reg?.periodicSync){                       // 沒後端時的備援，已安裝的 PWA 才拿得到
    try{ await reg.periodicSync.register('daily-checkin',{minInterval:12*60*60*1000}) }catch{}
  }
  schedule(); renderRemind();
  if(pushOn()&&done.has(todayStr)) api('/api/checkin',{method:'POST',body:JSON.stringify({uid,date:todayStr})});
}

function nextRemindAt(){
  const now=new Date(), t=new Date(now);
  t.setHours(REMIND_HOUR,0,0,0);
  if(t<=now) t.setDate(t.getDate()+1);
  return t;
}
let timer;
function schedule(){
  clearTimeout(timer);
  if(!remindOn()) return;
  timer=setTimeout(async()=>{
    if(!load().has(ymd(new Date()))) await notify();
    schedule();
  }, nextRemindAt()-Date.now());
}
async function notify(){
  const opt={body:'今天還沒打卡，記得吃保健品 🌿',icon:'icons/icon-192.png',
    badge:'icons/icon-192.png',tag:'kamee-daily'};
  const reg=await navigator.serviceWorker?.getRegistration().catch(()=>null);
  if(reg) reg.showNotification('KAMEE 打卡提醒',opt); else new Notification('KAMEE 打卡提醒',opt);
}
remindSw.onclick=()=>{
  if(remindOn()){ localStorage.setItem(REMIND_KEY,'off'); clearTimeout(timer); unsubscribePush(); renderRemind() }
  else enableRemind();
};
function askNotify(){
  if(!canNotify||Notification.permission!=='default'||modalOpen) return;
  localStorage.setItem(ASKED_KEY,'1');
  openModal({ico:'🔔',title:'每天早上提醒你',
    body:'早上 9:00 提醒打卡，避免斷了連續紀錄。',ok:'開啟提醒',no:'先不要',
    onOk:enableRemind});
}

/* ---------- 加到主畫面 ---------- */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;queueInstall()});
// 慢兩秒再跳，先讓使用者看到今天的狀態；有別的 modal 開著就等下次進來
const queueInstall=()=>setTimeout(askInstall,2000);

function askInstall(){
  if(standalone||localStorage.getItem(INSTALL_KEY)==='no'||modalOpen) return;
  openModal({ico:'📲',title:'加到主畫面',
    body: deferredPrompt ? '像 App 一樣一鍵打開，離線也能看紀錄。'
      : '點瀏覽器的「分享」→「加入主畫面」，就能像 App 一樣打開。',
    ok: deferredPrompt?'加入 ✓':'我知道了', no:'以後再說',
    onOk: async()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const {outcome}=await deferredPrompt.userChoice;
      deferredPrompt=null;
      if(outcome==='accepted') localStorage.setItem(INSTALL_KEY,'yes');
    },
    onNo:()=>localStorage.setItem(INSTALL_KEY,'no')});
}
// iOS 沒有 beforeinstallprompt，改成延遲跳手動加入說明
if(isIOS&&!standalone) queueInstall();

/* 把今天是否打卡寫進 cache，讓 service worker 背景提醒時讀得到 */
function syncSw(){
  caches?.open('kamee-state')
    .then(c=>c.put('./state',new Response(JSON.stringify({last:ymd(new Date())}))))
    .catch(()=>{});
}

renderName();renderStats();renderCal();renderRemind();schedule();
if(done.has(todayStr)) syncSw();

// 跨過午夜時重新整理，避免日期停在昨天
setInterval(()=>{ if(ymd(new Date())!==todayStr) location.reload() },60000);

if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
