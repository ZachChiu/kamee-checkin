name = "kamee-checkin"
main = "worker/index.mjs"
compatibility_date = "2026-09-16"

# 前端靜態檔；找不到對應檔案的請求才會進 worker（/api/* 走 worker）
[assets]
directory = "./public"

# 每小時跑一次，Worker 依每個人設定的時間與時區決定要不要送
[triggers]
crons = ["0 * * * *"]

[vars]
VAPID_SUBJECT = "mailto:awdx8326@gmail.com"
VAPID_PUBLIC_KEY = "BNf3AqHe1kVuM2HJJTzxtQ7-I6ghQCDmIF6_gFaI6-zYpkZzNTjq3ksGgHnmjkxJEO2BbrgC3YaVyIgVsf8-4Zs"   # npm run vapid 產生，公鑰可公開

# wrangler kv namespace create SUBS 之後把 id 填進來
[[kv_namespaces]]
