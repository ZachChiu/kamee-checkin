name = "kamee-checkin"
main = "worker/index.mjs"
compatibility_date = "2026-09-16"

# 前端靜態檔；找不到對應檔案的請求才會進 worker（/api/* 走 worker）
[assets]
directory = "./public"

# UTC 01:00 = 台灣 09:00
[triggers]
crons = ["0 1 * * *"]

[vars]
VAPID_SUBJECT = "mailto:awdx8326@gmail.com"
VAPID_PUBLIC_KEY = "PUT_VAPID_PUBLIC_KEY_HERE"     # npm run vapid 產生，公鑰可公開

# wrangler kv namespace create SUBS 之後把 id 填進來
[[kv_namespaces]]
binding = "SUBS"
id = "PUT_KV_NAMESPACE_ID_HERE"
